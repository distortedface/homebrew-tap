name: Audit Tap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject private release dependencies
        run: |
          if grep -R "github.com/distortedface/SpinningCube.run/releases" README.md Formula; then
            echo "The public Tap must not depend on private repository releases." >&2
            exit 1
          fi
      - name: Validate generated Formula
        run: |
          if test -f Formula/spinningcube.rb; then
            ruby -c Formula/spinningcube.rb
            brew style Formula/spinningcube.rb
          fi
